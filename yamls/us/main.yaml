      # The NA audio driver, the layer below src/main/na/. Outside na/, only the asm at 0x72860 calls into it
      # (AudioThread_UpdateImpl, the per-frame audio task).
      - [0x1070, c, nad/synthesis]
      # nad/heap, nad/load and nad/thread are three translation units: IDO rounds each section of an object up to a
      # multiple of 16, and their rodata at 0x800ABBE0 holds two interior round-ups (12 bytes after AudioHeap_Init's
      # float, 4 after AudioLoad_Init's), blocks of 48 / 48 / 208. Their .text has none, so each boundary is only pinned
      # to a window of 16-aligned function starts between the blocks' rodata users, and every choice in it links the
      # same ROM. The boundaries taken are OoT's load.c and thread.c file starts. nad/os has no rodata; its .data
      # argues for it (src/main/nad/os.c).
      - [0x3BF0, c, nad/heap]
      - [0x6B80, c, nad/load]
      - [0xA530, c, nad/thread]
      - [0xB890, c, nad/os]
