      # nad/synthesis has no rodata (no jump table, no pooled FP literal), so only .text shows it is a unit of its own:
      # its last function ends with a live delay slot at 0x80002FE8, and the zero word at 0x80002FEC is round-up before
      # nad/heap starts 16-aligned at 0x80002FF0. IDO puts no padding between the functions of one unit
      # (AudioHeap_InitPersistentCache ends on a live delay slot, AudioHeap_InitTemporaryCache starts in the next word).
      #
      # One `.rodata` line per c file: splat inlines a rodata symbol into the .s of the function that references it
      # only within one c segment, so a file's rodata split over several lines leaves its symbols undefined at link.
      - [0xAC7E0, .rodata, nad/heap]
      - [0xAC810, .rodata, nad/load]
      - [0xAC840, .rodata, nad/thread]
